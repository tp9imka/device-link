name: DeviceLink checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action's default also requests the removed 'tools' package, which fails sdkmanager.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check --no-daemon --continue
  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.6'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip check
      - run: python -m pytest -q
  swift:
    runs-on: ubuntu-latest
    container: swift:6.2-jammy
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios/DeviceLinkKit
  interop:
    # Live relay + Kotlin SDK + Swift CLI pairing by QR link in both directions.
    runs-on: ubuntu-latest
    needs: [relay, swift]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.6'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action's default also requests the removed 'tools' package, which fails sdkmanager.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: python -m pip install -r server/requirements.txt
      - run: swift --version && swift build --package-path ios/DeviceLinkKit
      - run: SWIFT_CLI="$PWD/ios/DeviceLinkKit/.build/debug/devicelink" PYTHON=python scripts/interop_e2e.sh
  ios:
    # Compiles the iOS apps, share extension and sample (simulator, unsigned).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ios && xcodegen
      - run: |
          cd ios
          for scheme in DeviceLink DeviceLinkSample; do
            if ! xcodebuild -project DeviceLink.xcodeproj -scheme "$scheme" -destination 'generic/platform=iOS Simulator' \
                CODE_SIGNING_ALLOWED=NO build > "build-$scheme.log" 2>&1; then
              grep -E "error:|warning: .*(isolated|Sendable)" "build-$scheme.log" | sort -u | head -80
              tail -20 "build-$scheme.log"
              exit 1
            fi
          done
