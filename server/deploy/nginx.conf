# Include in nginx's http {} context. Replace relay.example.org and certificate paths.
# Run the relay on loopback. Do not enable upstream access/error request logging.
limit_req_zone $binary_remote_addr zone=relay_requests:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=relay_connections:10m;
server {
    listen 443 ssl;
    server_name relay.example.org;
    ssl_certificate /etc/letsencrypt/live/relay.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    # Nginx errors can contain request paths, so disable its request error sink.
    error_log /dev/null crit;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 24m;
    client_body_timeout 30s;
    client_header_timeout 10s;
    limit_req zone=relay_requests burst=10 nodelay;
    limit_req_status 429;
    limit_conn relay_connections 8;
    # Prometheus scrapes /metrics with a bearer token; optionally restrict it to your monitoring host:
    # location = /metrics { allow 10.0.0.0/8; deny all; proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        # Long polls last up to max_poll_wait (50 s) plus margin.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
